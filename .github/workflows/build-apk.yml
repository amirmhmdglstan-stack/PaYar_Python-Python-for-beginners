name: Build PaYar Android APK & Publish Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-and-release:
    name: Build Full Offline Android APK & Publish to Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore payar-release-key.jks \
            -alias payar-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass payar123456 \
            -keypass payar123456 \
            -dname "CN=PaYar Python, OU=Education, O=PaYar, L=Tehran, S=Tehran, C=IR"

      - name: Build Debug & Signed Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PaYar-Python-v1.0.0-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/PaYar-Python-v1.0.0-Debug.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaYar-Python-Android-APKs
          path: dist/*.apk

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PaYar Python v1.0.0 — Full Offline Duolingo-Style Python Learning APK 🐍"
          body: |
            ## 🐍 PaYar (پایار) — Learn Python Like a Game!
            
            **PaYar** is a complete offline, gamified Duolingo-style Python learning app for beginners.
            
            ### ✨ What's Included in this APK Release:
            - 🗺️ **6 Complete Learning Units & 24 Interactive Lessons** (Multiple choice, Tap-to-build code tiles, Bug hunter, Live coding challenges)
            - 🛠️ **6 Unit Boss Projects + 6 Full Game/Program Studio Projects** (Build calculators, RPG inventory, Caesar cipher, Number Quest, Rock-Paper-Scissors AI, ASCII Dungeon Crawler, and Tic-Tac-Toe!)
            - 💻 **100% Offline Python Code Runner & IDE (`PyRunner`)** with Mobile Quick-Keys Bar, Live Variable Inspector, and 8 Playable Templates
            - 🏆 **Gamification**: XP, Levels, Streaks, Hearts, PyGems Shop, Mascot Outfits, Daily Quests & Emerald League Leaderboard
            - 🌐 **Bilingual UI**: Instant switch between **English** and **Persian (فارسی)**
            
            ### 📲 Installation Instructions (Android):
            1. Download **`PaYar-Python-v1.0.0-Release.apk`** below on your Android phone or tablet.
            2. Tap the downloaded APK file and allow installation from your browser/files if prompted.
            3. Open **PaYar** and start coding Python 100% offline!
          files: |
            dist/PaYar-Python-v1.0.0-Release.apk
            dist/PaYar-Python-v1.0.0-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
